[package]
name = "my-agent-natives"
version = "0.0.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2", features = ["napi8"] }
napi-derive = "2"
blake3 = "1"
globset = "0.4"
regex = "1"
walkdir = "2"
libc = "0.2"
tree-sitter = "0.23"
tree-sitter-typescript = "0.23"

[build-dependencies]
napi-build = "2"
