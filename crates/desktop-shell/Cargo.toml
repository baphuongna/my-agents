[package]
name = "my-agent-desktop-shell"
version = "0.0.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `tray-icon` enables tauri::tray (TrayIconBuilder). `image-png` enables
# Image::from_path/from_bytes for PNG decoding — needed to load the tray icon
# from crates/desktop-shell/icons/*.png.
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
# Registers the `myagent://` URI scheme with the OS (Linux: xdg-mime, Windows:
# registry, macOS: Info.plist at install time). Delivers OpenUrlEvent to the
# running app via the `deep-link://new-url` IPC channel; drained via the
# `deep_link_take_pending` command before the webview is up.
tauri-plugin-deep-link = "2"
# Prevents a second launch (e.g. via `myagent://` deep-link click) from
# spawning a second sidecar process; the existing instance is brought forward.
tauri-plugin-single-instance = "2"

[features]
custom-protocol = ["tauri/custom-protocol"]
