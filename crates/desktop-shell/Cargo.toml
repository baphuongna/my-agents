[package]
name = "my-agent-desktop-shell"
version = "0.0.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[features]
custom-protocol = ["tauri/custom-protocol"]
