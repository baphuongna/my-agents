<!doctype html>
<!--
  my-agent desktop dashboard (§25.3).

  Self-contained HTML served by the Tauri shell (crates/desktop-shell).
  No build step, no external scripts, no module bundler.

  Runtime requirements (provided by the Tauri shell):
    - `window.__TAURI__` must be enabled (set `app.withGlobalTauri: true`
      in tauri.conf.json — owned by the desktop-shell executor).
    - The shell registers the following IPC commands (Tauri v2):
        * `gateway_info`            → { port: number, wsPath: string, token?: string }
        * `deep_link_take_pending`  → string[]   (drain queued myagent:// URIs)
    - The shell emits the following events:
        * `sidecar://state`         → { state: "booting"|"ready"|"degraded"|"stopped",
                                        port?: number, detail?: string }
        * `deep-link://received`    → { payload: string }   (a myagent:// URI)

  Dev fallback (opened in a plain browser):
    - The page still renders, polls /ready, connects to the gateway WS, and
      accepts deep-link via `?deepLink=myagent://...` in the URL.
    - All `invoke()` calls are wrapped in try/catch; missing handlers degrade
      gracefully (logged to console, not user-visible).

  Source: spec §25.2 web dashboard + §25.3 desktop shell.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self' tauri: ipc: http://127.0.0.1:* http://localhost:*; connect-src 'self' tauri: ipc: http://127.0.0.1:* ws://127.0.0.1:* ws://localhost:*; img-src 'self' data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
<title>my-agent desktop</title>
<style>
  /* ── reset ─────────────────────────────────────────────────────── */
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font: 14px/1.45 -apple-system, BlinkMacSystemFont, system-ui, "Segoe UI",
          Roboto, "Helvetica Neue", Arial, sans-serif;
    background: #0b0d10;
    color: #e6edf3;
    overflow: hidden;
  }

  /* ── header ────────────────────────────────────────────────────── */
  header {
    padding: 10px 16px;
    background: #161b22;
    border-bottom: 1px solid #30363d;
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  header strong { font-size: 15px; letter-spacing: 0.2px; }
  header .spacer { flex: 1; }

  .pill {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 2px 8px;
    border-radius: 10px;
    background: #30363d;
    font-size: 11px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    line-height: 1.4;
    transition: background-color 120ms ease, color 120ms ease;
  }
  .pill.boot-booting { background: #30363d; color: #e6edf3; }
  .pill.boot-ready   { background: #238636; color: #fff; }
  .pill.boot-degraded{ background: #d29922; color: #fff; }
  .pill.boot-stopped { background: #da3633; color: #fff; }
  .pill.ws-offline   { background: #30363d; color: #8b949e; }
  .pill.ws-live      { background: #238636; color: #fff; }
  .pill.ws-recon     { background: #d29922; color: #fff; }
  .pill.ws-error     { background: #da3633; color: #fff; }
  .pill.tauri-on     { background: #1f6feb; color: #fff; }
  .pill.tauri-off    { background: #30363d; color: #8b949e; }

  /* ── boot banner ───────────────────────────────────────────────── */
  #boot-banner {
    display: none;
    padding: 12px 16px;
    background: #161b22;
    border-bottom: 1px solid #30363d;
    align-items: center;
    gap: 12px;
    font-size: 13px;
  }
  #boot-banner.booting  { display: flex; background: #161b22; }
  #boot-banner.ready    { display: none; }
  #boot-banner.degraded { display: flex; background: #2d1d04; border-bottom-color: #d29922; color: #f0c674; }
  #boot-banner.stopped  { display: flex; background: #2a0a0a; border-bottom-color: #da3633; color: #ff8181; }
  .spinner {
    width: 14px;
    height: 14px;
    border: 2px solid #30363d;
    border-top-color: #58a6ff;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    flex-shrink: 0;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #boot-detail {
    margin-left: auto;
    font-family: ui-monospace, monospace;
    font-size: 11px;
    color: #8b949e;
  }

  /* ── main layout ───────────────────────────────────────────────── */
  main {
    display: grid;
    grid-template-columns: 1fr 320px;
    gap: 1px;
    background: #30363d;
    /* height = viewport - header - (maybe-banner) - input-bar */
    height: calc(100vh - 49px - 48px);
  }
  main.no-banner { height: calc(100vh - 49px - 48px); }
  main.with-banner { height: calc(100vh - 49px - 48px - 48px); }
  #stream {
    background: #0b0d10;
    overflow-y: auto;
    padding: 12px;
  }
  #sidebar {
    background: #0d1117;
    padding: 12px;
    overflow-y: auto;
  }
  #sidebar h3 {
    margin: 0 0 8px;
    font-size: 12px;
    color: #8b949e;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  #info {
    font-size: 12px;
    color: #8b949e;
    font-family: ui-monospace, monospace;
    word-break: break-all;
  }
  #info dt { color: #58a6ff; margin-top: 6px; }
  #info dd { margin: 0 0 4px; color: #e6edf3; }

  /* ── session list ─────────────────────────────────────── */
  #sidebar h3.list-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 16px;
  }
  #sidebar h3.list-head button {
    background: #21262d;
    color: #58a6ff;
    border: 1px solid #30363d;
    border-radius: 3px;
    font-size: 10px;
    padding: 2px 6px;
    cursor: pointer;
    text-transform: none;
    letter-spacing: 0;
    font-family: inherit;
  }
  #sidebar h3.list-head button:hover { background: #30363d; }
  #session-list { list-style: none; margin: 0; padding: 0; }
  #session-list li {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 4px 6px;
    border-radius: 3px;
    font-size: 12px;
    font-family: ui-monospace, monospace;
  }
  #session-list li:hover { background: #161b22; }
  #session-list .sid { color: #e6edf3; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #session-list .sstat { font-size: 10px; padding: 1px 5px; border-radius: 8px; background: #30363d; color: #8b949e; }
  #session-list .sstat.active   { background: #238636; color: #fff; }
  #session-list .sstat.idle     { background: #30363d; color: #8b949e; }
  #session-list .sstat.errored  { background: #da3633; color: #fff; }
  #session-list .skill {
    background: transparent;
    color: #8b949e;
    border: 1px solid #30363d;
    border-radius: 3px;
    font-size: 10px;
    padding: 1px 5px;
    cursor: pointer;
    font-family: inherit;
  }
  #session-list .skill:hover { background: #da3633; color: #fff; border-color: #da3633; }
  #session-empty { font-size: 12px; color: #8b949e; font-style: italic; padding: 4px 6px; }

  /* ── event tiles ───────────────────────────────────────────────── */
  .ev {
    margin-bottom: 8px;
    padding: 6px 8px;
    border-radius: 4px;
    background: #161b22;
    border-left: 3px solid #388bfd;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .ev.tool     { border-left-color: #f0883e; }
  .ev.approval { border-left-color: #d29922; }
  .ev.error    { border-left-color: #f85149; }
  .ev.budget   { border-left-color: #a371f7; }
  .ev.health   { border-left-color: #2ea043; }

  /* ── aggregated streaming response block ──────────────────────── */
  .ev.response {
    border-left-color: #58a6ff;
    background: #0d1117;
    padding: 8px 10px;
  }
  .ev.response .meta { color: #58a6ff; }
  .ev.response .response-text {
    white-space: pre-wrap;
    word-break: break-word;
    font-size: 13px;
    line-height: 1.5;
    min-height: 1em;
  }
  .ev.response.streaming .response-text::after {
    content: "▌";
    animation: blink 0.8s steps(2) infinite;
    color: #58a6ff;
  }
  @keyframes blink { 50% { opacity: 0; } }

  /* ── error banner ──────────────────────────────────────────────── */
  #error-banner {
    display: none;
    position: fixed;
    top: 49px;
    left: 0;
    right: 0;
    padding: 8px 16px;
    background: #2a0a0a;
    border-bottom: 1px solid #da3633;
    color: #ff8181;
    font-size: 12px;
    font-family: ui-monospace, monospace;
    align-items: center;
    gap: 8px;
    z-index: 40;
    box-shadow: 0 2px 8px rgba(0,0,0,.4);
  }
  #error-banner.show { display: flex; }
  #error-banner .dismiss {
    margin-left: auto;
    background: transparent;
    border: 1px solid #da3633;
    color: #ff8181;
    padding: 2px 8px;
    border-radius: 3px;
    cursor: pointer;
    font-size: 11px;
  }
  #error-banner .dismiss:hover { background: #da3633; color: #fff; }

  .meta {
    font-size: 11px;
    color: #8b949e;
    font-family: ui-monospace, monospace;
  }

  /* ── input bar ─────────────────────────────────────────────────── */
  #input-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: #161b22;
    border-top: 1px solid #30363d;
    padding: 8px 16px;
    display: flex;
    gap: 8px;
    z-index: 10;
  }
  #prompt {
    flex: 1;
    background: #0d1117;
    color: #e6edf3;
    border: 1px solid #30363d;
    border-radius: 4px;
    padding: 8px 10px;
    font: inherit;
    font-size: 13px;
  }
  #prompt:focus { outline: none; border-color: #58a6ff; }
  #send-btn {
    background: #238636;
    color: #fff;
    border: 0;
    padding: 8px 16px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 500;
  }
  #send-btn:disabled { background: #30363d; color: #8b949e; cursor: not-allowed; }
  button.deny { background: #da3633; color: #fff; }

  /* ── approval modal ────────────────────────────────────────────── */
  #approval-modal {
    position: fixed;
    bottom: 64px;
    right: 16px;
    background: #161b22;
    border: 1px solid #d29922;
    padding: 12px;
    border-radius: 6px;
    max-width: 360px;
    box-shadow: 0 8px 24px rgba(0,0,0,.5);
    z-index: 50;
    font-size: 13px;
  }
  #approval-modal pre {
    background: #0d1117;
    padding: 6px;
    border-radius: 3px;
    font-size: 11px;
    overflow-x: auto;
    margin: 6px 0;
  }
  #approval-modal .actions { display: flex; gap: 8px; }

  /* ── toast container (deep-link events) ────────────────────────── */
  #toast-container {
    position: fixed;
    top: 60px;
    right: 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    z-index: 100;
    pointer-events: none;
    max-width: 380px;
  }
  .toast {
    pointer-events: auto;
    background: #161b22;
    border: 1px solid #58a6ff;
    border-left-width: 3px;
    padding: 10px 12px;
    border-radius: 4px;
    font-size: 12px;
    box-shadow: 0 4px 12px rgba(0,0,0,.5);
    animation: slideIn 0.2s ease-out;
  }
  @keyframes slideIn {
    from { transform: translateX(120%); opacity: 0; }
    to   { transform: translateX(0);    opacity: 1; }
  }
  .toast.invalid { border-color: #da3633; border-left-color: #da3633; }
  .toast strong { color: #58a6ff; font-family: ui-monospace, monospace; font-size: 12px; }
  .toast.invalid strong { color: #ff8181; }
  .toast-params {
    font-family: ui-monospace, monospace;
    font-size: 11px;
    color: #8b949e;
    margin: 4px 0 8px;
    word-break: break-all;
    white-space: pre-wrap;
  }
  .toast-actions { display: flex; gap: 6px; }
  .toast button {
    background: transparent;
    color: #8b949e;
    font-size: 11px;
    padding: 3px 8px;
    border: 1px solid #30363d;
    border-radius: 3px;
    cursor: pointer;
  }
  .toast button:hover { background: #30363d; color: #e6edf3; }
</style>
</head>
<body>
<header>
  <strong>my-agent</strong>
  <span class="pill boot-booting" id="boot-status" title="sidecar lifecycle state">booting</span>
  <span class="pill ws-offline"   id="ws-status"   title="gateway websocket state">offline</span>
  <span class="pill"              id="seq-pill"    title="last event sequence">seq 0</span>
  <span class="pill"              id="port-pill"   title="gateway port">port —</span>
  <span class="spacer"></span>
  <span class="pill tauri-off"    id="tauri-pill"  title="Tauri IPC presence">browser</span>
</header>

<div id="boot-banner" class="booting">
  <div class="spinner" id="boot-spinner"></div>
  <span id="boot-text">Waiting for gateway to become ready…</span>
  <span id="boot-detail"></span>
</div>

<div id="error-banner">
  <span id="error-text"></span>
  <button type="button" class="dismiss" id="error-dismiss" title="dismiss">×</button>
</div>

<main id="main">
  <div id="stream"></div>
  <aside id="sidebar">
    <h3>session</h3>
    <dl id="info">
      <dt>address</dt><dd id="info-address">—</dd>
      <dt>cursor</dt><dd id="info-cursor">0</dd>
      <dt>events</dt><dd id="info-events">0</dd>
      <dt>runtime</dt><dd id="info-runtime">browser</dd>
    </dl>
    <h3 class="list-head">sessions <span><button type="button" id="new-session" title="new session">+</button><button type="button" id="refresh-sessions" title="refresh session list">↻</button></span></h3>
    <ul id="session-list"></ul>
    <div id="session-empty">no sessions</div>
  </aside>
</main>

<div id="approval-modal" style="display:none"></div>
<div id="toast-container" aria-live="polite"></div>

<div id="input-bar">
  <input id="prompt" type="text" placeholder="send a message…" autocomplete="off" spellcheck="false" />
  <button id="send-btn" type="button">send</button>
</div>

<script>
"use strict";
/* ────────────────────────────────────────────────────────────────────
 * my-agent desktop dashboard — runtime
 * ──────────────────────────────────────────────────────────────────── */

(function () {
  // ── DOM refs ────────────────────────────────────────────────────────
  const $ = (id) => document.getElementById(id);
  const bootStatus   = $("boot-status");
  const wsStatus     = $("ws-status");
  const seqPill      = $("seq-pill");
  const portPill     = $("port-pill");
  const tauriPill    = $("tauri-pill");
  const bootBanner   = $("boot-banner");
  const bootSpinner  = $("boot-spinner");
  const bootText     = $("boot-text");
  const bootDetail   = $("boot-detail");
  const main         = $("main");
  const stream       = $("stream");
  const infoAddress  = $("info-address");
  const infoCursor   = $("info-cursor");
  const infoEvents   = $("info-events");
  const infoRuntime  = $("info-runtime");
  const promptInput  = $("prompt");
  const sendBtn      = $("send-btn");
  const approval     = $("approval-modal");
  const toastBox     = $("toast-container");
  const sessionList  = $("session-list");
  const sessionEmpty = $("session-empty");
  const refreshBtn   = $("refresh-sessions");
  const newSessBtn   = $("new-session");
  const errorBanner  = $("error-banner");
  const errorText    = $("error-text");
  const errorDismiss = $("error-dismiss");

  // ── Tauri detection ─────────────────────────────────────────────────
  // `window.__TAURI__` is only present when `app.withGlobalTauri: true`
  // in tauri.conf.json. We treat absence as "browser/dev mode".
  const tauri = (typeof window !== "undefined"
                 && window.__TAURI__
                 && window.__TAURI__.core
                 && window.__TAURI__.event)
                ? window.__TAURI__
                : null;
  const inTauri = tauri !== null;

  // Safe wrappers: never throw on dev/browser.
  async function safeInvoke(cmd, args) {
    if (!inTauri) return undefined;
    try {
      return await tauri.core.invoke(cmd, args);
    } catch (e) {
      console.warn("[ipc] invoke '" + cmd + "' failed:", e && e.message);
      return undefined;
    }
  }
  async function safeListen(event, handler) {
    if (!inTauri) return function () {};
    try {
      const unlisten = await tauri.event.listen(event, handler);
      return typeof unlisten === "function" ? unlisten : function () {};
    } catch (e) {
      console.warn("[ipc] listen '" + event + "' failed:", e && e.message);
      return function () {};
    }
  }

  tauriPill.textContent = inTauri ? "tauri" : "browser";
  tauriPill.className = "pill " + (inTauri ? "tauri-on" : "tauri-off");
  infoRuntime.textContent = inTauri ? "tauri" : "browser";

  // ── State ───────────────────────────────────────────────────────────
  const qs = new URLSearchParams(location.search);
  const DEFAULT_PORT = 3000;
  const READY_TIMEOUT_MS = 60_000;
  const READY_POLL_MS = 500;
  const WS_RETRY_MS = 1000;

  let gatewayPort = parseInt(qs.get("port") || "", 10) || DEFAULT_PORT;
  let wsToken = qs.get("token") || "";
  let cursor = 0;
  let ws = null;
  let wsReady = false;
  let bootState = "booting";
  let readyPollHandle = null;
  let eventsRendered = 0;

  // The Rust side may also inject globals as a fast path (avoids IPC roundtrip).
  if (typeof window.__DESKTOP_GATEWAY_PORT__ === "number" && window.__DESKTOP_GATEWAY_PORT__ > 0) {
    gatewayPort = window.__DESKTOP_GATEWAY_PORT__;
  }
  if (typeof window.__DESKTOP_WS_TOKEN__ === "string") {
    wsToken = window.__DESKTOP_WS_TOKEN__;
  }
  // Tag the side panel with the boot port.
  portPill.textContent = "port " + gatewayPort;
  infoAddress.textContent = qs.get("address") || "127.0.0.1";

  // ── Boot state UI ───────────────────────────────────────────────────
  function setBootState(state, detail) {
    bootState = state;
    bootStatus.textContent = state;
    bootStatus.className = "pill boot-" + state;
    switch (state) {
      case "ready":
        bootBanner.className = "ready";
        main.className = "no-banner";
        bootSpinner.style.display = "none";
        bootText.textContent = "Gateway ready";
        break;
      case "degraded":
        bootBanner.className = "degraded";
        main.className = "with-banner";
        bootSpinner.style.display = "none";
        bootText.textContent = "Gateway unreachable — retrying";
        break;
      case "stopped":
        bootBanner.className = "stopped";
        main.className = "with-banner";
        bootSpinner.style.display = "none";
        bootText.textContent = "Gateway stopped";
        break;
      case "booting":
      default:
        bootBanner.className = "booting";
        main.className = "with-banner";
        bootSpinner.style.display = "";
        bootText.textContent = "Waiting for gateway to become ready…";
        break;
    }
    if (detail) {
      bootDetail.textContent = String(detail);
    } else {
      bootDetail.textContent = "";
    }
  }

  function setWsState(state) {
    wsStatus.textContent = state;
    wsStatus.className = "pill ws-" + state;
  }

  function setPort(port) {
    if (typeof port === "number" && port > 0 && port !== gatewayPort) {
      gatewayPort = port;
      portPill.textContent = "port " + gatewayPort;
    }
  }

  // ── Error display ───────────────────────────────────────────────────
  let errorTimer = null;
  function showError(msg) {
    errorText.textContent = String(msg);
    errorBanner.classList.add("show");
    if (errorTimer) clearTimeout(errorTimer);
    errorTimer = setTimeout(function () { errorBanner.classList.remove("show"); }, 10_000);
  }
  function clearError() {
    errorBanner.classList.remove("show");
    errorText.textContent = "";
    if (errorTimer) { clearTimeout(errorTimer); errorTimer = null; }
  }
  errorDismiss.addEventListener("click", clearError);

  // ── Readiness probe ─────────────────────────────────────────────────
  async function probeReady() {
    try {
      const ctl = new AbortController();
      const timer = setTimeout(function () { ctl.abort(); }, 2000);
      const res = await fetch("http://127.0.0.1:" + gatewayPort + "/ready", {
        method: "GET",
        cache: "no-store",
        signal: ctl.signal,
      });
      clearTimeout(timer);
      if (!res.ok) return false;
      const body = await res.json().catch(function () { return {}; });
      return body && body.ok === true;
    } catch (_e) {
      return false;
    }
  }

  async function waitForGateway() {
    // NOTE: browser JS uses Date.now() directly (cannot import core.time in a static HTML asset;
    // the §18 single-time-helper invariant applies to TS/Rust, not browser-side JS).
    const deadline = Date.now() + READY_TIMEOUT_MS;
    while (Date.now() < deadline) {
      if (await probeReady()) {
        setBootState("ready");
        connectWs();
        void refreshSessions();
        void fetchStatus();
        return true;
      }
      // Yield to the event loop.
      await new Promise(function (r) { setTimeout(r, READY_POLL_MS); });
    }
    setBootState("degraded", "did not become ready in " + Math.round(READY_TIMEOUT_MS / 1000) + "s");
    return false;
  }

  // ── WebSocket ───────────────────────────────────────────────────────
  function wsUrl() {
    let q = "";
    if (cursor > 0) q += (q ? "&" : "?") + "since=" + cursor;
    if (wsToken)   q += (q ? "&" : "?") + "token=" + encodeURIComponent(wsToken);
    return "ws://127.0.0.1:" + gatewayPort + "/events" + q;
  }

  function connectWs() {
    if (ws && ws.readyState === WebSocket.OPEN) return;
    try {
      ws = new WebSocket(wsUrl());
    } catch (e) {
      setWsState("error");
      console.warn("[ws] construct failed:", e);
      setTimeout(connectWs, WS_RETRY_MS);
      return;
    }
    setWsState("offline");

    ws.addEventListener("open", function () {
      wsReady = true;
      setWsState("live");
    });
    ws.addEventListener("close", function () {
      wsReady = false;
      setWsState("recon");
      setTimeout(connectWs, WS_RETRY_MS);
    });
    ws.addEventListener("error", function () {
      // The `close` handler will run after this; reconnect logic lives there.
      showError("WebSocket connection error — reconnecting…");
      try { ws.close(); } catch (_e) {}
    });
    ws.addEventListener("message", function (m) {
      let env;
      try {
        env = JSON.parse(m.data);
      } catch (_e) {
        return; // malformed — skip
      }
      if (typeof env.seq === "number") {
        cursor = env.seq;
        seqPill.textContent = "seq " + cursor;
        infoCursor.textContent = String(cursor);
      }
      renderEvent(env);
    });
  }

  // ── Event rendering (mirrors packages/web/src/index.ts) ─────────────
  function summarize(e) {
    if (!e || typeof e !== "object") return "";
    if (e.kind === "turn") {
      // turnEvent is the current field name; e.e is a legacy alias.
      const te = e.turnEvent || e.e;
      if (te) {
        if (te.state === "Streaming" && te.chunk) {
          if (te.chunk.kind === "text") return te.chunk.text || "";
          return ""; // tool_calls / done / error chunks — handled elsewhere
        }
        if (te.state === "ToolCalls")     return "[tool calls]";
        if (te.state === "ToolExec")      return "[tool results]";
        if (te.state === "AwaitingApproval") return "[awaiting approval]";
        if (te.state === "Completed") {
          const u = te.usage || {};
          return "[completed · in " + (u.input || 0) + "/" + (u.output || 0) + "]";
        }
        if (te.state === "Failed") return "[failed: " + ((te.error && te.error.message) || "unknown") + "]";
        if (te.state === "Recoverable") return "[recoverable: " + ((te.error && te.error.message) || "unknown") + "]";
        if (te.state === "Cancelled") return "[cancelled: " + (te.reason || "") + "]";
        return "[" + te.state + "]";
      }
      if (e.stage === "start") return "";
      if (e.stage === "end")   return "";
      return "";
    }
    if (e.kind === "budget")    return "budget: $" + (Number(e.spentUsd) || 0).toFixed(4);
    if (e.kind === "approval") return "approval: " + (e.stage || "?");
    if (e.kind === "health")   return "health: " + (e.status || "?");
    if (e.kind === "log")      return (e.level || "info") + ": " + (e.message || "");
    try {
      return JSON.stringify(e).slice(0, 240);
    } catch (_e) {
      return "[unserializable event]";
    }
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c];
    });
  }

  // Track the current aggregated response element for streaming chunks.
  let currentResponse = null;

  function createResponseElement(seq, kind) {
    const div = document.createElement("div");
    div.className = "ev response streaming";

    const meta = document.createElement("div");
    meta.className = "meta";
    meta.textContent = "#" + (seq != null ? seq : "?") + " " + kind;
    div.appendChild(meta);

    const text = document.createElement("div");
    text.className = "response-text";
    text.textContent = "";
    div.appendChild(text);

    return div;
  }

  function renderEventTile(env, e, kind) {
    const div = document.createElement("div");
    div.className = "ev " + kind;

    const meta = document.createElement("div");
    meta.className = "meta";
    meta.textContent = "#" + (env.seq != null ? env.seq : "?") + " " + kind;
    div.appendChild(meta);

    const body = document.createElement("div");
    body.textContent = summarize(e);
    div.appendChild(body);

    stream.appendChild(div);
    stream.scrollTop = stream.scrollHeight;
  }

  function renderEvent(env) {
    if (!env || typeof env !== "object") return;
    const e = env.event || {};
    const kind = (typeof e.kind === "string") ? e.kind : "";

    // ── Streaming text aggregation ────────────────────────────────
    // Group consecutive text chunks for the same turn into a single
    // response block instead of one tile per token.
    if (kind === "turn") {
      if (e.stage === "start") {
        currentResponse = null; // new turn → reset
        return;
      }
      if (e.stage === "end") {
        if (currentResponse) {
          currentResponse.classList.remove("streaming");
          currentResponse = null;
        }
        eventsRendered++;
        infoEvents.textContent = String(eventsRendered);
        return;
      }
      if (e.stage === "event" && e.turnEvent) {
        const te = e.turnEvent;
        // Text chunk → append to current response block.
        if (te.state === "Streaming" && te.chunk && te.chunk.kind === "text") {
          if (!currentResponse) {
            currentResponse = createResponseElement(env.seq, "assistant");
            stream.appendChild(currentResponse);
          }
          const textEl = currentResponse.querySelector(".response-text");
          textEl.textContent += te.chunk.text || "";
          stream.scrollTop = stream.scrollHeight;
          eventsRendered++;
          infoEvents.textContent = String(eventsRendered);
          return;
        }
        // Non-text chunk (tool_calls, done, error) → finalize current response.
        if (currentResponse && (te.state === "ToolCalls" || te.state === "Completed" || te.state === "Failed" || te.state === "Cancelled")) {
          currentResponse.classList.remove("streaming");
          currentResponse = null;
        }
        // Failed / Recoverable → show as error tile.
        if (te.state === "Failed" || te.state === "Recoverable") {
          renderEventTile(env, e, "error");
          if (te.error && te.error.message) showError(te.error.message);
          eventsRendered++;
          infoEvents.textContent = String(eventsRendered);
          return;
        }
        // Other turn events → render as tile.
        renderEventTile(env, e, kind);
        eventsRendered++;
        infoEvents.textContent = String(eventsRendered);
        return;
      }
    }

    // ── Log events with error level → error banner ────────────────
    if (kind === "log" && e.level === "error") {
      renderEventTile(env, e, "error");
      if (e.message) showError(e.message);
      eventsRendered++;
      infoEvents.textContent = String(eventsRendered);
      return;
    }

    // ── Default: render as event tile ─────────────────────────────
    renderEventTile(env, e, kind);
    eventsRendered++;
    infoEvents.textContent = String(eventsRendered);

    // ── Approval requests ─────────────────────────────────────────
    if (e.kind === "approval" && e.stage === "requested") showApproval(e);
  }

  // ── Approval modal ───────────────────────────────────────────────
  // The approval event arrives as {kind:"approval", stage:"requested", call:{...}}.
  // When the user clicks allow/deny we post the decision back via WS so the
  // gateway's onWsMessage handler can relay it to the agent's approval channel.
  // We also try the IPC bridge for future Tauri shell support.
  let pendingApproval = null;

  function showApproval(e) {
    pendingApproval = e;
    approval.style.display = "block";
    const callJson = JSON.stringify(e.call || {}, null, 2);
    const callName = (e.call && e.call.name) || "tool";
    const callArgs = (e.call && e.call.args) || {};
    const subject = callArgs.command || callArgs.path || callArgs.url || "";
    approval.innerHTML =
      "<strong>approval required</strong>" +
      "<div style=\"font-size:12px;margin:4px 0;color:#8b949e\">" +
        escapeHtml(callName) + (subject ? ": " + escapeHtml(subject) : "") +
      "</div>" +
      "<pre>" + escapeHtml(callJson) + "</pre>" +
      "<div class=\"actions\">" +
      "<button type=\"button\" id=\"approval-allow\">allow</button>" +
      "<button type=\"button\" class=\"deny\" id=\"approval-deny\">deny</button>" +
      "</div>";
    $("approval-allow").addEventListener("click", function () { submitApproval("allow"); });
    $("approval-deny").addEventListener("click",  function () { submitApproval("deny");  });
  }

  function submitApproval(decision) {
    approval.style.display = "none";
    const callId   = (pendingApproval && pendingApproval.call && pendingApproval.call.id) || null;
    const callName = (pendingApproval && pendingApproval.call && pendingApproval.call.name) || null;
    pendingApproval = null;

    const payload = {
      kind: "approval_decision",
      decision: decision,
      callId: callId,
      tool: callName,
      reason: decision === "deny" ? "user denied via desktop UI" : "",
    };

    let sent = false;

    // Primary path: WS (same channel the gateway uses for prompts).
    if (ws && wsReady) {
      try {
        ws.send(JSON.stringify(payload));
        sent = true;
      } catch (e) {
        showError("Failed to send approval decision: " + (e && e.message ? e.message : String(e)));
      }
    }

    // Secondary path: IPC bridge (Tauri shell, if the command is registered).
    void safeInvoke("approval_decision", payload).then(function (result) {
      if (!sent && result === undefined && !inTauri) {
        showError("Cannot send approval decision: WebSocket not connected and IPC unavailable.");
      }
    });
  }

  // ── Session list (proxied via IPC bridge + gateway HTTP) ───────────
  // Fetches the session list from the gateway `/sessions` endpoint. In
  // Tauri this could go through the `get_status` IPC, but `/sessions` is a
  // separate endpoint; we use a direct `fetch` (the CSP allows 127.0.0.1)
  // and fall back to the IPC bridge for new/kill actions.
  async function fetchGatewaySessions() {
    try {
      const ctl = new AbortController();
      const timer = setTimeout(function () { ctl.abort(); }, 2000);
      const res = await fetch("http://127.0.0.1:" + gatewayPort + "/sessions", {
        method: "GET",
        cache: "no-store",
        signal: ctl.signal,
      });
      clearTimeout(timer);
      if (!res.ok) return null;
      return await res.json();
    } catch (_e) {
      return null;
    }
  }

  function renderSessionList(sessions) {
    sessionList.innerHTML = "";
    if (!Array.isArray(sessions) || sessions.length === 0) {
      sessionEmpty.style.display = "";
      return;
    }
    sessionEmpty.style.display = "none";
    for (let i = 0; i < sessions.length; i++) {
      const s = sessions[i];
      const id = (typeof s.id === "string") ? s.id : String(s.id || "?");
      const status = (typeof s.status === "string") ? s.status : "";
      const li = document.createElement("li");

      const sid = document.createElement("span");
      sid.className = "sid";
      sid.textContent = id;
      sid.title = id;
      li.appendChild(sid);

      if (status) {
        const stat = document.createElement("span");
        stat.className = "sstat " + status;
        stat.textContent = status;
        li.appendChild(stat);
      }

      const kill = document.createElement("button");
      kill.type = "button";
      kill.className = "skill";
      kill.textContent = "×";
      kill.title = "kill session " + id;
      kill.addEventListener("click", function () { void killSessionById(id); });
      li.appendChild(kill);

      sessionList.appendChild(li);
    }
  }

  async function refreshSessions() {
    const data = await fetchGatewaySessions();
    if (data === null) {
      sessionEmpty.textContent = "unavailable";
      sessionEmpty.style.display = "";
      sessionList.innerHTML = "";
      return;
    }
    sessionEmpty.textContent = "no sessions";
    renderSessionList(data);
  }

  async function killSessionById(id) {
    const result = await safeInvoke("kill_session", { id: id });
    if (result === undefined && !inTauri) {
      // Browser dev fallback: try a direct DELETE.
      try {
        await fetch("http://127.0.0.1:" + gatewayPort + "/sessions/" + encodeURIComponent(id), { method: "DELETE" });
      } catch (_e) { /* best-effort */ }
    }
    await refreshSessions();
  }

  async function newSession() {
    const result = await safeInvoke("new_session");
    if (result === undefined && !inTauri) {
      // Browser dev fallback: try a direct POST.
      try {
        await fetch("http://127.0.0.1:" + gatewayPort + "/sessions", { method: "POST", body: "{}", headers: { "content-type": "application/json" } });
      } catch (_e) { /* best-effort */ }
    }
    await refreshSessions();
  }

  refreshBtn.addEventListener("click", function () { void refreshSessions(); });
  newSessBtn.addEventListener("click", function () { void newSession(); });

  // ── Input bar ───────────────────────────────────────────────────────
  function sendPrompt() {
    const text = promptInput.value.trim();
    if (!text) return;
    if (!ws || !wsReady) {
      showError("Cannot send message: WebSocket not connected. Waiting for reconnect…");
      return;
    }
    try {
      ws.send(JSON.stringify({ text: text }));
      promptInput.value = "";
      clearError();
    } catch (e) {
      showError("Failed to send message: " + (e && e.message ? e.message : String(e)));
    }
  }
  sendBtn.addEventListener("click", sendPrompt);
  promptInput.addEventListener("keydown", function (ev) {
    if (ev.key === "Enter" && !ev.shiftKey) {
      ev.preventDefault();
      sendPrompt();
    }
  });

  // ── Deep-link handling ──────────────────────────────────────────────
  // URI grammar (mirrors packages/desktop/src/index.ts validateDeepLink):
  //   myagent://<action>?<key>=<value>&...
  //   actions: open, approve, install, focus
  function parseDeepLink(uri) {
    let parsed;
    try {
      parsed = new URL(uri);
    } catch (_e) {
      return { ok: false, reason: "malformed URI" };
    }
    if (parsed.protocol !== "myagent:") {
      return { ok: false, reason: "wrong scheme: " + parsed.protocol };
    }
    const host = parsed.hostname.toLowerCase();
    const allowed = ["open", "approve", "install", "focus"];
    if (allowed.indexOf(host) < 0) {
      return { ok: false, reason: "unknown action: " + host };
    }
    const params = {};
    for (const [k, v] of parsed.searchParams) params[k] = v;
    return { ok: true, action: host, params: params, raw: uri };
  }

  function showDeepLinkToast(result) {
    const toast = document.createElement("div");
    toast.className = "toast" + (result.ok ? "" : " invalid");
    if (result.ok) {
      toast.innerHTML =
        "<strong>myagent://" + escapeHtml(result.action) + "</strong>" +
        "<div class=\"toast-params\">" + escapeHtml(JSON.stringify(result.params, null, 2)) + "</div>" +
        "<div class=\"toast-actions\">" +
        "<button type=\"button\" data-act=\"dismiss\">dismiss</button>" +
        "</div>";
    } else {
      toast.innerHTML =
        "<strong>invalid deep-link</strong>" +
        "<div class=\"toast-params\">" + escapeHtml(result.reason || "unknown") + "</div>" +
        "<div class=\"toast-actions\">" +
        "<button type=\"button\" data-act=\"dismiss\">dismiss</button>" +
        "</div>";
    }
    toast.querySelector('[data-act="dismiss"]').addEventListener("click", function () {
      toast.remove();
    });
    toastBox.appendChild(toast);
    setTimeout(function () { toast.remove(); }, 8000);
  }

  function handleDeepLink(uri) {
    if (typeof uri !== "string" || uri.length === 0) return;
    const result = parseDeepLink(uri);
    showDeepLinkToast(result);
    if (result.ok) {
      console.info("[deep-link] action=" + result.action, result.params);
    } else {
      console.warn("[deep-link] rejected:", result.reason);
    }
  }

  async function drainPendingDeepLinks() {
    const list = await safeInvoke("deep_link_take_pending");
    if (Array.isArray(list)) {
      for (let i = 0; i < list.length; i++) handleDeepLink(list[i]);
    }
  }

  function readQueryDeepLink() {
    const uri = qs.get("deepLink");
    if (uri) handleDeepLink(uri);
  }

  // ── IPC subscriptions ───────────────────────────────────────────────
  function setupDeepLinkListener() {
    return safeListen("deep-link://received", function (ev) {
      const payload = ev && ev.payload;
      if (typeof payload === "string") handleDeepLink(payload);
    });
  }

  function setupSidecarListener() {
    return safeListen("sidecar://state", function (ev) {
      const p = ev && ev.payload;
      if (!p || typeof p !== "object") return;
      if (typeof p.port === "number") {
        setPort(p.port);
        // If we were already polling, restart so the new port is probed.
        if (bootState !== "ready") startGatewayHandshake();
      }
      if (typeof p.state === "string") {
        setBootState(p.state, p.detail);
        if (p.state === "ready") { connectWs(); void refreshSessions(); }
      }
    });
  }

  async function fetchGatewayInfo() {
    const info = await safeInvoke("gateway_info");
    if (info && typeof info === "object") {
      if (typeof info.port === "number") setPort(info.port);
      if (typeof info.wsPath === "string") {
        // The shell may hand us a fully-built WS path; honour the token.
        try {
          const u = new URL(info.wsPath, "ws://127.0.0.1:" + gatewayPort);
          const tok = u.searchParams.get("token");
          if (tok) wsToken = tok;
        } catch (_e) { /* best-effort */ }
      } else if (typeof info.token === "string" && info.token) {
        wsToken = info.token;
      }
    }
  }

  // Query the gateway `/status` via the IPC bridge (`get_status` command).
  // Populates the sidebar with model + version so the user can see what the
  // sidecar is running. Falls back to a direct fetch in browser dev mode.
  async function fetchStatus() {
    let status = await safeInvoke("get_status");
    if (!status) {
      try {
        const ctl = new AbortController();
        const timer = setTimeout(function () { ctl.abort(); }, 2000);
        const res = await fetch("http://127.0.0.1:" + gatewayPort + "/status", { cache: "no-store", signal: ctl.signal });
        clearTimeout(timer);
        if (res.ok) status = await res.json();
      } catch (_e) { /* best-effort */ }
    }
    if (status && typeof status === "object") {
      if (typeof status.model === "string") {
        infoRuntime.textContent = (inTauri ? "tauri · " : "browser · ") + status.model;
      }
    }
  }

  // ── Bootstrap ───────────────────────────────────────────────────────
  let handshakeStarted = false;
  function startGatewayHandshake() {
    if (handshakeStarted) return;
    handshakeStarted = true;
    setBootState("booting");
    waitForGateway();
  }

  setBootState("booting");

  // 1. Drain any deep-link the OS delivered before the renderer was ready.
  readQueryDeepLink();
  void drainPendingDeepLinks();

  // 2. Subscribe to ongoing IPC events.
  void setupDeepLinkListener();
  void setupSidecarListener();

  // 3. Resolve the gateway port + token (Rust side is the source of truth).
  void fetchGatewayInfo().then(function () { startGatewayHandshake(); });

  // In case the IPC handlers are missing (browser dev), start polling the
  // default port after a short delay so the page is still usable.
  setTimeout(function () {
    if (!handshakeStarted) startGatewayHandshake();
  }, 1000);
})();
</script>
</body>
</html>
