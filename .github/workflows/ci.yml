name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.0"
          components: clippy

      # Tauri 2 system dependencies for Linux. macOS uses WebKit.framework
      # via Xcode CLT (preinstalled on runners). Windows is intentionally
      # omitted from the matrix — the Rust napi/tauri stack needs MSVC +
      # WebView2 + a separate apt-equivalent step, deferred to a follow-up.
      - name: Install Linux Tauri deps
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      # §18 invariant enforcement (TS-7-compatible grep guards — ESLint's
      # @typescript-eslint parser is incompatible with the native Go compiler).
      - name: Lint (invariant #10 — single time helper)
        run: npm run lint
      - name: Lint deps (invariant #19 — no cross-transport imports)
        run: npm run lint:deps

      - name: Typecheck
        run: npm run typecheck

      # Workspace-wide cargo build — covers crates/natives (cdylib) AND
      # crates/desktop-shell (Tauri 2 binary). This step compiles the
      # sources; the actual *.node artifact is produced by release.yml via
      # `napi build`, which is intentionally out of scope here.
      - name: Build desktop shell (workspace)
        run: cargo build --workspace

      - name: Test
        run: npm test

      # Eval unit tier — runs defaultHarness().grade() which exercises only
      # the mock "unit" scenario tier (see packages/eval/src/egress.test.ts).
      # Zero-cost, no secrets required, safe on every PR.
      - name: Eval (unit tier)
        run: npm run eval

      # Workspace-wide clippy (covers both crates/natives AND
      # crates/desktop-shell). Uses the package.json script for consistency
      # with local `npm run lint:rust`.
      - name: Clippy (workspace)
        run: npm run lint:rust
